site_name: Brokefish
site_description: The cheapest superhuman chessbot from scratch
# site_url and repo_url are unset on purpose: the repo is not under git yet and the
# domain is not chosen. Both are cosmetic (canonical link, "edit this page" button).

# Build:  .venv/bin/mkdocs build   ->  site/
# Serve:  .venv/bin/mkdocs serve   ->  http://127.0.0.1:8000 with live reload
#
# Markdown under docs/ is the source of truth; the HTML in site/ is generated and
# is not committed. Deploying to GitHub Pages is `mkdocs gh-deploy`.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Brokefish: index.md
  - Specification: spec.md
  - Roadmap: roadmap.md
  - Engineering:
      - Search (MCTS v0): mcts.md
      - Training loop: train.md
      - Environment: env.md
      - Evaluation: evals.md
      - Search debugger: debugger.md
      - Performance ledger: perf.md
  - Prior art: due_diligence.md
  - Legacy:
      - Board representation (superseded): legacy/representation.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false

strict: true
