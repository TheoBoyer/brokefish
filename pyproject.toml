[project]
name = "brokefish"
version = "0.0.1"
description = "The cheapest superhuman chessbot from scratch"
requires-python = ">=3.13"
# Pinned to the exact stack the kernels were tuned and validated against on sm89.
# Triton's codegen moves fast enough that a version bump is a kernel change:
# re-run tests/ and bench/ before accepting one. `uv sync` installs this, and
# uv.lock pins the rest of the closure.
dependencies = [
    "torch==2.13.0",
    "triton==3.7.1",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "chess==1.11.2",
    "pyarrow==25.0.0",
    "ninja==1.13.0",
    "wandb==0.28.1",
    "matplotlib==3.11.1",
]

# Installed by `uv sync` by default.
[dependency-groups]
dev = ["pytest==9.1.1"]

# Every package in the closure, pinned to the environment every number in
# docs/ledger/perf.md was measured in. Without this, uv picks newer transitive
# releases (nvidia-nvjitlink 13.4 instead of 13.2, among others).
[tool.uv]
constraint-dependencies = [
    "annotated-types==0.8.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "chess==1.11.2",
    "click==8.4.2",
    "contourpy==1.3.3",
    "cuda-toolkit==13.2.1",
    "cycler==0.12.1",
    "filelock==3.29.0",
    "fonttools==4.63.0",
    "fsspec==2026.4.0",
    "idna==3.18",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "kiwisolver==1.5.0",
    "markupsafe==3.0.3",
    "matplotlib==3.11.1",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "ninja==1.13.0",
    "numpy==2.5.1",
    "nvidia-cublas==13.4.0.1",
    "nvidia-cuda-cupti==13.2.75",
    "nvidia-cuda-nvrtc==13.2.78",
    "nvidia-cuda-runtime==13.2.75",
    "nvidia-cudnn-cu13==9.20.0.48",
    "nvidia-cufft==12.2.0.46",
    "nvidia-cufile==1.17.1.22",
    "nvidia-curand==10.4.2.55",
    "nvidia-cusolver==12.2.0.1",
    "nvidia-cusparse==12.7.10.1",
    "nvidia-cusparselt-cu13==0.8.1",
    "nvidia-nccl-cu13==2.29.7",
    "nvidia-nvjitlink==13.2.78",
    "nvidia-nvshmem-cu13==3.4.5",
    "nvidia-nvtx==13.2.75",
    "packaging==26.2",
    "pillow==12.3.0",
    "platformdirs==4.11.0",
    "pluggy==1.6.0",
    "protobuf==7.35.1",
    "pyarrow==25.0.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.18.0",
    "sentry-sdk==2.66.1",
    "setuptools==78.1.0",
    "six==1.17.0",
    "sympy==1.14.0",
    "torch==2.13.0",
    "triton==3.7.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "wandb==0.28.1",
]

[tool.pytest.ini_options]
# The repository root on sys.path, so tests/ can `import brokefish` and
# `import tests.test_model` without an installed package or a PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "mutation: slow suite that mutates the kernel to test the tests; needs --mutation",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brokefish*"]

# torch and triton both come from the CUDA 13.2 wheel index, not PyPI. Same
# index as the reference environment, which is what makes the cache hit.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
triton = { index = "pytorch-cu132" }
