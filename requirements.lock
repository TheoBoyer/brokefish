# Exact wheel set the kernel was tuned and validated against (RTX 4060, sm89,
# CUDA 13.2). Fully frozen, including torch's transitive closure: leaving the
# nvidia-* packages unpinned lets the resolver pick newer releases, which means
# re-downloading ~3 GB instead of hardlinking from the local uv cache.
#
# One index, no PyPI. Every wheel below is served by the cu132 index, and mixing
# in PyPI makes it the primary source for the non-torch packages (uv's default
# first-index strategy), which is another way to miss the cache.
#
# Only needed on a fresh machine (a rented GPU, CI). Locally, .venv is a symlink
# to the environment this stack was validated in -- there is nothing to install.
#
#   uv venv --python 3.13
#   uv pip install --index-url https://download.pytorch.org/whl/cu132 -r requirements.lock
--index-url https://download.pytorch.org/whl/cu132

